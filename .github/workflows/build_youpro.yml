name: build_youpro

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "Bundle ID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

      opensafari:
        description: "Integrate Open in YouTube (Safari Extension)"
        default: true
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tweaks:
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      youpro: true
      opensafari: ${{ inputs.opensafari }}

  package:
    name: build_youpro
    runs-on: macos-latest
    needs: build-tweaks
    permissions:
      contents: write
    env:
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: Download Built Debs
        uses: actions/download-artifact@v8
        with:
          name: built-debs
          path: ${{ github.workspace }}

      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,opensafari

      - name: Download And Validate IPA
        run: |
          wget "${{ inputs.ipa_url }}" --quiet --no-verbose -O youtube.ipa
          file_type=$(file --mime-type -b youtube.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Get YouTube Version
        run: |
          unzip -q youtube.ipa -d ytextracted
          echo "YT_VERSION=$(grep -A 1 '<key>CFBundleVersion</key>' ytextracted/Payload/YouTube.app/Info.plist | grep '<string>' | awk -F'[><]' '{print $3}')" >> $GITHUB_ENV
          rm -rf ytextracted

      - name: Get YouPro Version
        run: |
          mkdir _youpro_extract && cd _youpro_extract
          ar x "../YouPro.deb" >/dev/null 2>&1
          if [ -f control.tar.gz ]; then
            tar -xzf control.tar.gz ./control
          elif [ -f control.tar.xz ]; then
            tar -xJf control.tar.xz ./control
          elif [ -f control.tar.zst ]; then
            tar --zstd -xf control.tar.zst ./control
          else
            echo "::error::Could not find control tarball in YouPro.deb"
            exit 1
          fi
          VERSION=$(grep '^Version:' control | awk '{print $2}' | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from YouPro.deb control file"
            exit 1
          fi
          echo "YOUPRO_VERSION=$VERSION" >> $GITHUB_ENV
          cd .. && rm -rf _youpro_extract

      - name: Install Cyan
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject Tweaks Into IPA
        run: |
          tweaks=""
          if [ "${{ inputs.opensafari }}" = "true" ] && [ -e "OpenYouTubeSafariExtension.appex" ]; then
            tweaks="OpenYouTubeSafariExtension.appex"
          fi
          for f in *.deb; do
            [ -f "$f" ] && tweaks="$tweaks $f"
          done
          cyan -i youtube.ipa -o YPO_${{ env.YT_VERSION }}.ipa -uwesf $tweaks -n "${{ inputs.display_name }}" -b ${{ inputs.bundle_id }}

      - name: Create A Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          i=1
          while gh release view "youproextra-ipa${i}" --repo "$GITHUB_REPOSITORY" &>/dev/null; do
            i=$(( i + 1 ))
          done
          gh release create "youproextra-ipa${i}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "YPO_${{ env.YT_VERSION }}" \
            --draft \
            YPO_${{ env.YT_VERSION }}.ipa

      - name: Job Summary - Build Complete
        run: echo -e '### 🛠️ Build YPO IPA Complete!' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Output The Draft Release Link
        run: |
          echo -e "### 🚀 Draft Release\n\nhttps://github.com/${{ github.repository }}/releases" >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Cleanup
        run: |
          echo -e "### 🧹 Cleanup\n\nhttps://github.com/${{ github.repository }}/actions/workflows/delete_old_workflows_run.yml\nhttps://github.com/${{ github.repository }}/actions/workflows/delete_old_draft_releases.yml" >> $GITHUB_STEP_SUMMARY
